
name: darksea

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: darksea-namenode
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=darksea
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - namenode_data:/hadoop/dfs/name
    networks:
      - darksea-network

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: darksea-datanode
    restart: unless-stopped
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SERVICE_PRECONDITION=namenode:9870
    volumes:
      - datanode_data:/hadoop/dfs/data
    networks:
      - darksea-network

  pig:
    build:
      context: ./pig
      dockerfile: Dockerfile
    container_name: darksea-pig
    hostname: pig
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - ../pig:/workspace/pig
    networks:
      - darksea-network
    stdin_open: true
    tty: true
    command: sleep infinity

  hive-metastore-db:
    image: postgres:15
    container_name: darksea-hive-metastore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive_password
    volumes:
      - hive_metastore_data:/var/lib/postgresql/data
    networks:
      - darksea-network

  hive:
    build:
      context: ./hive
      dockerfile: Dockerfile
    container_name: darksea-hive
    hostname: hive
    depends_on:
      - namenode
      - datanode
      - hive-metastore-db
    environment:
      - SERVICE_NAME=hiveserver2
      - DB_DRIVER=postgres
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - IS_RESUME=true
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./hive/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    networks:
      - darksea-network

  spark-master:
    image: darksea-spark:3.5.3
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: darksea-spark-master
    hostname: spark-master
    restart: unless-stopped
    entrypoint:
      - /opt/spark/bin/spark-class
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ../spark:/workspace/spark
    networks:
      - darksea-network

  spark-worker:
    image: darksea-spark:3.5.3
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: darksea-spark-worker
    hostname: spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    entrypoint:
      - /opt/spark/bin/spark-class
    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "2"
      - --memory
      - 2g
      - --webui-port
      - "8081"
      - spark://spark-master:7077
    ports:
      - "8082:8081"
    volumes:
      - ../spark:/workspace/spark
    networks:
      - darksea-network

  kafka:
    image: apache/kafka:3.9.1
    container_name: darksea-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - darksea-network
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  namenode_data:
  datanode_data:
  hive_metastore_data:
  kafka_data:

networks:
  darksea-network:
    driver: bridge
