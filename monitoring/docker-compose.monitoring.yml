name: darksea-monitoring

services:

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: darksea-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    networks:
      - darksea-network

  grafana:
    image: grafana/grafana:12.1.0
    container_name: darksea-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - darksea-network

  docker-exporter:
    build:
      context: ./docker-exporter
      dockerfile: Dockerfile
    image: darksea-docker-exporter:1.0
    container_name: darksea-docker-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - darksea-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: darksea-kafka-exporter
    restart: unless-stopped
    command:
      - --kafka.server=kafka:29092
    ports:
      - "127.0.0.1:9308:9308"
    networks:
      - darksea-network

volumes:
  prometheus_data:
  grafana_data:

networks:
  darksea-network:
    external: true
    name: darksea_darksea-network
