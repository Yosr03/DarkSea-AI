global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: docker-containers
    static_configs:
      - targets:
          - docker-exporter:9100

  - job_name: kafka
    static_configs:
      - targets:
          - kafka-exporter:9308
